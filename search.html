<script>
(function () {
  var idx = window.KBAR_SEARCH_INDEX, q = document.getElementById('q'), out = document.getElementById('out'), stat = document.getElementById('stat');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function render(list, total) {
    stat.textContent = list.length ? (list.length + ' / ' + total + ' 页命中') : (total ? '无命中——换个关键词试试（标题与小节名匹配）' : '');

      return '<li><span class="tag">' + e.p + '</span><a class="t" href="' + e.u + '">' + esc(e.t) + '</a>'
        + (secs ? '<ul class="secs">' + secs + '</ul>' : '') + '</li>';
    }).join('');
  }
  function run() {
    var k = q.value.trim().toLowerCase();
    if (!k) { render([], idx.length); stat.textContent = '共 ' + idx.length + ' 页（输入即搜）'; return; }
    render(idx.filter(function (e) {
      return e.t.toLowerCase().indexOf(k) >= 0 || e.s.some(function (s) { return s.h.toLowerCase().indexOf(k) >= 0; });

  }
  q.addEventListener('input', run);
  stat.textContent = '共 ' + idx.length + ' 页（输入即搜）';
